name: Django CI

on: [ push, pull_request ]

jobs:


  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 080201
          POSTGRES_DB: homework

          DJANGO_SECRET_KEY: django-insecure-*@i#y2gl3--=i$z$hb1%t-nm=jx@6tr7(55uniahl8#c!&b6vt
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENGINE: django.db.backends.postgresql_psycopg2
      POSTGRES_DB: homework
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 080201
      DJANGO_SECRET_KEY: django-insecure-*@i#y2gl3--=i$z$hb1%t-nm=jx@6tr7(55uniahl8#c!&b6vt



    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

  build:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to Docker Hub
          run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
        - name: Build and push Docker image
          run: |
            docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:${{ github.sha }} .
            docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:${{ github.sha }} ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:latest
            docker push ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:${{ github.sha }}
            docker push ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name:  adding SSH key
        run: |
          echo "SSH key would be added here ()"
          echo "SSH_PRIVATE_KEY is set: ${{ secrets.SSH_PRIVATE_KEY != '' }}"

      - name:  SSH setup
        run: |
          echo "SSH setup  for user ${{ secrets.SSH_USER }} and server ${{ secrets.SERVER_IP }}"

      - name:  verifying server structure
        run: |
          echo " server structure check: ls -la ~/drf_thework-app on ${{ secrets.SERVER_IP }}"

      - name: Prepare deployment files
        run: |
          echo "Preparing .env file ()"
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env
          ls -la .env

      - name:  syncing necessary files
        run: |
          echo " rsync of docker-compose.yml, .env, and nginx to ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/drf_thework-app/"

      - name:  deploying application
        run: |
          echo " deployment steps:"
          echo "1. Logging into Docker Hub as ${{ secrets.DOCKER_HUB_USERNAME }}"
          echo "2. Running docker compose down --remove-orphans"
          echo "3. Running docker compose pull"
          echo "4. Running docker compose up -d --build"
          echo "5. Checking services with docker compose ps"
          echo "Deployment simulated successfully for ~/drf_thework-app"